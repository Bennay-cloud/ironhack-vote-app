services:
  vote:
    image: bennay/vote:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - back-tier

  result:
    image: bennay/result:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    image: bennay/worker:latest
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier: